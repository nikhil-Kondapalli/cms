[project]
name = "user-service"
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy",
    "alembic",
    "pydantic-settings",
    "asyncpg>=0.31.0",
    "psycopg[binary]>=3.3.4",
    "greenlet>=3.5.4",
    "shared-contracts",
    "email-validator",
    "cryptography>=50.0.0",
]

[tool.uv.sources]
shared-contracts = { path = "../shared-contracts", editable = true }
[tool.black]
line-length = 88

[tool.ruff]
line-length = 88

[tool.pyright]
extraPaths = ["../shared-contracts"]
