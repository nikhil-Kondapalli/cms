[project]
name = "api-gateway"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "orjson>=3.11.9",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.2",
    "python-jose[cryptography]>=3.5.0",
    "python-json-logger>=4.1.0",
    "structlog>=26.1.0",
    "uvicorn>=0.52.0",
    "shared-contracts",
]

[tool.uv.sources]
shared-contracts = { path = "../shared-contracts", editable = true }

[tool.ruff]
line-length = 88

[tool.pyright]
extraPaths = ["../shared-contracts"]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
